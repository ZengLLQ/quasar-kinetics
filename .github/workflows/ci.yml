name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22.x', '1.23.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Compile CLI and Packages
        run: go build -v ./...

      - name: Run Test Suite
        run: go test -v -cover ./...

      - name: Run Two-Stream Instability Simulation
        run: go run ./examples/two_stream_instability

      - name: Run Relativistic Cyclotron Simulation
        run: go run ./examples/relativistic_cyclotron
